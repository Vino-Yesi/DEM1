services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WMS_APP_PASSWORD: ${WMS_APP_PASSWORD:?Set WMS_APP_PASSWORD in .env}
      WMS_MIGRATION_PASSWORD: ${WMS_MIGRATION_PASSWORD:?Set WMS_MIGRATION_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/01-schema.sh:/docker-entrypoint-initdb.d/01-schema.sh:ro
      - ./sql/001_schema.sql:/docker/wms/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wms"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WMS_ENVIRONMENT: ${WMS_ENVIRONMENT:-development}
      WMS_DATABASE_URL: ${WMS_DATABASE_URL:?Set WMS_DATABASE_URL in .env}
      WMS_SYSTEM_DATABASE_URL: ${WMS_SYSTEM_DATABASE_URL:?Set WMS_SYSTEM_DATABASE_URL in .env}
      WMS_REDIS_URL: redis://redis:6379/0
      WMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WMS_DB_POOL_MIN: ${WMS_DB_POOL_MIN:-1}
      WMS_DB_POOL_MAX: ${WMS_DB_POOL_MAX:-10}
      WMS_LOG_LEVEL: ${WMS_LOG_LEVEL:-INFO}
    ports:
      - "${WMS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "orchestrator.run_relay"]
    environment:
      WMS_ENVIRONMENT: ${WMS_ENVIRONMENT:-development}
      WMS_DATABASE_URL: ${WMS_DATABASE_URL:?Set WMS_DATABASE_URL in .env}
      WMS_SYSTEM_DATABASE_URL: ${WMS_SYSTEM_DATABASE_URL:?Set WMS_SYSTEM_DATABASE_URL in .env}
      WMS_REDIS_URL: redis://redis:6379/0
      WMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WMS_DB_POOL_MIN: ${WMS_DB_POOL_MIN:-1}
      WMS_DB_POOL_MAX: ${WMS_DB_POOL_MAX:-10}
      WMS_LOG_LEVEL: ${WMS_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
